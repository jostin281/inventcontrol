services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-inventario}
    ports:
      # Puerto 5433 en el host (no 5432) para no chocar con un Postgres
      # local ya instalado. Esto NO afecta la conexión backend->postgres
      # dentro de Docker (siempre usa postgres:5432, ver DB_PORT abajo);
      # solo importa si quieres conectarte desde el host (ej. con un
      # cliente SQL, o corriendo el backend local con `npm run start:dev`
      # apuntando a este mismo Postgres — en ese caso usa DB_PORT=5433
      # en inventario-back/.env).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - invencontrol

  backend:
    build:
      context: ./inventario-back
    restart: unless-stopped
    env_file:
      - ./inventario-back/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invencontrol

  frontend:
    build:
      context: ./inventario-frond
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - invencontrol

networks:
  invencontrol:

volumes:
  postgres_data:

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>InvenControl – Sistema de Inventario</title>
  <meta name="description" content="InvenControl: gestión de inventario para pequeños negocios">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- v=2 en la URL: fuerza a que el navegador la trate como un archivo
       nuevo y no siga usando el favicon viejo que tenía cacheado, aunque
       ya se haya ajustado el Cache-Control en nginx. PNG primero porque
       los navegadores modernos lo prefieren sobre .ico. -->
  <link rel="icon" type="image/png" href="assets/logo.png?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>

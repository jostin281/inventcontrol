server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Las fotos de producto van como base64 en el body del POST/PATCH;
  # sin esto nginx corta cualquier request mayor a 1MB con un 413.
  client_max_body_size 10M;

  # Angular SPA: cualquier ruta que no sea un archivo real cae a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reenvía las llamadas a la API hacia el backend (mismo dominio para el
  # navegador: sin CORS, sin URLs hardcodeadas).
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cachear assets con hash en el nombre (outputHashing: all): el nombre
  # cambia solo si el contenido cambia, así que un cache largo es seguro.
  location ~* \.(?:js|css|woff2?|ttf)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
    add_header Cache-Control "public";
  }

  # Favicon.ico y las imágenes en assets/ (logo.png, etc.) NO llevan hash
  # en el nombre: con cache de 30 días el navegador se queda pegado con la
  # versión vieja para siempre, aunque se reconstruya el contenedor. Cache
  # corto para que se refresquen solos poco después de un rebuild.
  location ~* \.(?:svg|png|jpg|jpeg|gif|ico)$ {
    try_files $uri =404;
    expires 5m;
    access_log off;
    add_header Cache-Control "public, must-revalidate";
  }
}
